<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>EduGrants Finder</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1f23; --muted: #6b6f76; --line: #e4e2dc;
    --accent: #1f6f5c; --accent-soft: #e2f0eb; --warn: #b4560b; --warn-soft: #fbeee0;
    --bad: #a5352f; --bad-soft: #f8e5e3; --info: #2c5aa0; --info-soft: #e5edf8; --chip: #f0efea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141517; --panel: #1c1e21; --ink: #ececea; --muted: #9a9ea5; --line: #2c2f33;
      --accent: #5cc2a3; --accent-soft: #17332b; --warn: #f0a35e; --warn-soft: #3a2a19;
      --bad: #ef8a83; --bad-soft: #3b2120; --info: #8fb3ec; --info-soft: #1d2a3d; --chip: #26292d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  select, input[type=search] { font: inherit; color: var(--ink); background: var(--panel);
         border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  input[type=search] { flex: 1; min-width: 160px; }

  .funnel { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 18px 0 8px; }
  .step { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .step b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .step span { color: var(--muted); font-size: 12px; }
  .step.key { border-color: var(--accent); background: var(--accent-soft); }
  @media (max-width: 720px) { .funnel { grid-template-columns: repeat(3, 1fr); } }
  .note { color: var(--muted); font-size: 12.5px; margin: 0 0 18px; }

  .reasons { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
  .reasons h2 { font-size: 14px; margin: 0 0 8px; }
  .bar { display: grid; grid-template-columns: minmax(120px, 260px) 1fr 32px; align-items: center; gap: 10px; font-size: 13px; margin: 5px 0; }
  .bar .track { height: 8px; background: var(--chip); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--bad); border-radius: 4px; }
  .bar .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  @media (max-width: 560px) {
    .bar { grid-template-columns: 1fr 32px; row-gap: 4px; margin: 8px 0; }
    .bar .track { grid-column: 1 / -1; grid-row: 2; }
  }

  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tab { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px;
         padding: 6px 12px; font: inherit; font-size: 13.5px; cursor: pointer; }
  .tab[aria-pressed=true] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tab .c { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .top { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
  .title { font-weight: 600; font-size: 15.5px; color: var(--ink); text-decoration: none; }
  .title:hover { text-decoration: underline; }
  .badge { flex: none; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .b-queue { background: var(--info-soft); color: var(--info); }
  .b-taken { background: var(--accent-soft); color: var(--accent); }
  .b-skipped { background: var(--warn-soft); color: var(--warn); }
  .b-rejected { background: var(--bad-soft); color: var(--bad); }
  .meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
  .chip { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
  .chip.soon { background: var(--warn-soft); color: var(--warn); }
  .chip.q { background: var(--info-soft); color: var(--info); }
  .chip.fee { background: var(--bad-soft); color: var(--bad); }
  .fit { letter-spacing: 1px; color: var(--accent); }
  .line { font-size: 13.5px; margin-top: 6px; }
  .why { color: var(--bad); }
  .why.ed { color: var(--warn); }
  .muted { color: var(--muted); }
  details { margin-top: 6px; font-size: 13.5px; }
  summary { cursor: pointer; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .btn { font: inherit; font-size: 13.5px; border-radius: 8px; padding: 6px 12px; cursor: pointer;
         border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .5; cursor: default; }
  .links a { color: var(--muted); font-size: 13px; margin-right: 10px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
           padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.on { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>EduGrants Finder</h1>
      <div class="sub">Agent tekshirgan grantlar: O'zbekistonliklar uchun ochiq va muddati o'tmaganlar</div>
    </div>
    <select id="days" aria-label="Davr">
      <option value="3">Oxirgi 3 kun</option>
      <option value="7">Oxirgi 7 kun</option>
      <option value="14" selected>Oxirgi 14 kun</option>
      <option value="30">Oxirgi 30 kun</option>
      <option value="90">Oxirgi 90 kun</option>
    </select>
  </header>

  <div class="funnel" id="funnel"></div>
  <p class="note">«Vibe filtri»: AI sarlavha va qisqa matnni o'qib, kanalga mos emas deb tashlaganlar. Ular uchun O'zbekiston va muddat tekshirilmagan, shuning uchun pastdagi ro'yxatda yo'q.</p>

  <div class="reasons" id="reasons" hidden></div>

  <div class="tabs" id="tabs"></div>
  <div class="tools">
    <input type="search" id="q" placeholder="Qidirish: nomi, davlat, tashkilot...">
    <select id="sort" aria-label="Saralash">
      <option value="fit">Mosligi bo'yicha</option>
      <option value="deadline">Muddati bo'yicha</option>
      <option value="new">Eng yangilari</option>
    </select>
  </div>
  <div id="list"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const KEY = new URLSearchParams(location.search).get("key") || "";
const LABEL = { queue: "Navbatda", taken: "Olindi", skipped: "Muharrir o'tkazdi", rejected: "Agent tashladi" };
const TABS = [["all", "Hammasi"], ["queue", "Navbatda"], ["taken", "Olindi"], ["skipped", "Muharrir o'tkazdi"], ["rejected", "Agent tashladi"]];
let DATA = null, tab = "all";

const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const k of kids) if (k) n.append(k);
  return n;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("on"); setTimeout(() => t.classList.remove("on"), 2600); }
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }

async function load() {
  const r = await fetch(`/api/data?days=${$("days").value}`, { headers: { "X-Key": KEY } });
  if (!r.ok) { $("list").replaceChildren(el("div", { class: "empty", text: "Kirish taqiqlangan: havolani botdan /dashboard bilan qayta oling." })); return; }
  DATA = await r.json();
  render();
}

function renderFunnel(f) {
  const steps = [["found", "Topildi"], ["duplicate", "Takrorlar"], ["vibe_cut", "Vibe filtri tashladi"],
                 ["checked", "Rasmiy sahifa tekshirildi"], ["two_rules", "2 talabga mos"], ["shown_to_editors", "Sizga chiqdi"]];
  $("funnel").replaceChildren(...steps.map(([k, label]) =>
    el("div", { class: "step" + (k === "two_rules" ? " key" : "") }, el("b", { text: String(f[k] ?? 0) }), el("span", { text: label }))));
}

function renderReasons(reasons) {
  const box = $("reasons");
  if (!reasons.length) { box.hidden = true; return; }
  const max = Math.max(...reasons.map(r => r[1]));
  box.hidden = false;
  box.replaceChildren(el("h2", { text: "Agent nega tashladi" }),
    ...reasons.map(([why, n]) => el("div", { class: "bar" },
      el("div", { text: why }),
      el("div", { class: "track" }, el("div", { class: "fill", style: `width:${Math.round(n / max * 100)}%` })),
      el("div", { class: "n", text: String(n) }))));
}

function renderTabs(items) {
  const count = (v) => v === "all" ? items.length : items.filter(i => i.verdict === v).length;
  $("tabs").replaceChildren(...TABS.map(([v, label]) =>
    el("button", { class: "tab", "aria-pressed": String(tab === v), onclick: () => { tab = v; render(); } },
      label, el("span", { class: "c", text: String(count(v)) }))));
}

function card(it) {
  const meta = el("div", { class: "meta" });
  const chip = (text, cls = "") => text && meta.append(el("span", { class: "chip " + cls, text }));
  chip(it.where); chip(it.type); chip(it.format);
  if (it.levels.length) chip("👤 " + it.levels.join(", "));
  const dl = it.days_left === null ? it.deadline : `${it.deadline} · ${it.days_left} kun`;
  chip("📅 " + dl, it.days_left !== null && it.days_left <= 14 ? "soon" : "");
  if (it.uz === "unclear") chip("❓ O'zbekiston aniq emas", "q");
  if (it.fee === "paid") chip("💸 ariza pullik", "fee");
  if (it.funding === "full") chip("To'liq moliyalashtirilgan");

  const fit = it.fit ? "●".repeat(it.fit) + "○".repeat(5 - it.fit) : "";
  const kids = [
    el("div", { class: "top" },
      el("a", { class: "title", href: safeUrl(it.official), target: "_blank", rel: "noopener", text: it.title }),
      el("span", { class: "badge b-" + it.verdict, text: LABEL[it.verdict] })),
    meta,
  ];
  if (fit || it.fit_reason) kids.push(el("div", { class: "line" }, el("span", { class: "fit", text: fit, title: "Kanalga mosligi (AI bahosi)" }),
                                          it.fit_reason ? el("span", { class: "muted", text: "  " + it.fit_reason }) : null));
  if (it.why) kids.push(el("div", { class: "line why" + (it.verdict === "skipped" ? " ed" : ""), text: it.why }));
  if (it.summary) kids.push(el("details", {}, el("summary", { text: "Batafsil" }), el("div", { text: it.summary })));

  const actions = el("div", { class: "actions" });
  if (it.verdict !== "taken") {
    actions.append(el("button", { class: "btn primary", onclick: (e) => act(it, "take", e.target), text: "✅ Olamiz" }));
    if (it.verdict !== "queue") actions.append(el("button", { class: "btn", onclick: (e) => act(it, "queue", e.target), text: "↩️ Navbatga qaytarish" }));
  }
  actions.append(el("span", { class: "links" },
    el("a", { href: safeUrl(it.official), target: "_blank", rel: "noopener", text: "Rasmiy sahifa" }),
    it.found_at && it.found_at !== it.official ? el("a", { href: safeUrl(it.found_at), target: "_blank", rel: "noopener", text: "Topilgan joy · " + it.source }) : null,
    el("span", { class: "muted", text: it.discovered })));
  kids.push(actions);
  return el("div", { class: "card" }, ...kids);
}

async function act(it, action, btn) {
  btn.disabled = true;
  const r = await fetch("/api/action", { method: "POST", headers: { "X-Key": KEY, "Content-Type": "application/json" },
                                         body: JSON.stringify({ action, id: it.id }) });
  const out = await r.json().catch(() => ({}));
  toast(out.message || out.error || "Xato");
  await load();
}

function render() {
  if (!DATA) return;
  renderFunnel(DATA.funnel);
  renderReasons(DATA.reasons);
  renderTabs(DATA.items);
  const q = $("q").value.trim().toLowerCase();
  let items = DATA.items.filter(i => tab === "all" || i.verdict === tab);
  if (q) items = items.filter(i => [i.title, i.org, i.where, i.type, i.why, i.fit_reason].join(" ").toLowerCase().includes(q));
  const s = $("sort").value;
  items.sort(s === "fit" ? (a, b) => (b.fit || 0) - (a.fit || 0)
           : s === "deadline" ? (a, b) => (a.days_left ?? 9999) - (b.days_left ?? 9999)
           : (a, b) => b.id - a.id);
  $("list").replaceChildren(...(items.length ? items.map(card)
    : [el("div", { class: "empty", text: "Bu bo'limda hozircha hech narsa yo'q." })]));
}

$("days").addEventListener("change", load);
$("q").addEventListener("input", render);
$("sort").addEventListener("change", render);
load();
</script>
</body>
</html>
